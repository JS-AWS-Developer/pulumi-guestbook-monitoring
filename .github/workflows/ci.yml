name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails if the
      # lockfile and package.json have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Runs against Pulumi's mock runtime, so no cluster or credentials are needed.
      - name: Unit tests
        run: npm test
